[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisor/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=root

[program:api]
command=/bin/sh -c "cd /app/versiona-ai && uv run python directus_server.py"
directory=/app/versiona-ai
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=app
environment=PYTHONUNBUFFERED=1,PYTHONDONTWRITEBYTECODE=1,FLASK_PORT=8000,PATH=/usr/local/bin:/usr/bin:/bin,UV_CACHE_DIR=/app/.cache/uv,UV_TOOL_DIR=/app/.local/share/uv,UV_PYTHON_INSTALL_DIR=/app/.local/share/uv/python
